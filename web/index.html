<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD→WPS 一键排版</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>
  <header class="title-bar">MD→WPS 一键排版</header>
  <main>
    <!-- ===== Upload Section ===== -->
    <section id="upload-section">
      <div id="upload-zone" class="upload-zone">
        <div class="upload-icon">📎</div>
        <p class="upload-text">拖拽 .md 或 .docx 文件到此处，或点击上传</p>
        <p class="upload-hint">支持 Markdown 和 Word 文档，自动识别处理方式</p>
        <input type="file" id="file-input" accept=".md,.docx" hidden>
      </div>

      <!-- Dynamic options panel — shown after file is selected -->
      <div id="options-panel" class="options-panel" style="display:none;">
        <div class="file-info">
          <span id="file-icon" class="file-icon">📝</span>
          <span id="file-name" class="file-name"></span>
          <button id="file-remove" class="file-remove" title="移除文件">✕</button>
        </div>

        <div class="options-body">
          <div class="option-row">
            <label for="template-select">样式模板：</label>
            <select id="template-select">
              <option value="academic">学术论文</option>
              <option value="homework">课程作业</option>
              <option value="report">工作文档</option>
            </select>
          </div>

          <!-- Options for .md files -->
          <div id="md-options" class="sub-options">
            <label class="checkbox-label"><input type="checkbox" id="three-line-check"> 三线表</label>
          </div>

          <!-- Options for .docx files -->
          <div id="docx-options" class="sub-options" style="display:none;">
            <div class="option-row">
              <label>处理方式：</label>
              <div class="radio-group">
                <label class="radio-label"><input type="radio" name="docx-mode" value="repair" checked> 修复格式</label>
                <label class="radio-label"><input type="radio" name="docx-mode" value="convert"> 转换公式</label>
              </div>
            </div>
          </div>
        </div>

        <button id="start-btn" class="start-btn">开始转换</button>
      </div>

      <div id="loading" class="loading" hidden>
        <div class="spinner"></div>
        <p>正在转换...</p>
      </div>
      <p id="error-msg" class="error-msg" hidden></p>
    </section>

    <!-- ===== Results Section ===== -->
    <section id="results-section" hidden>
      <div class="stats-summary" id="stats-summary"></div>

      <div id="compat-panel" style="display:none;">
        <h3>WPS 兼容性检测</h3>
        <div id="compat-summary"></div>
        <div id="compat-items"></div>
      </div>

      <div class="formula-list-header">
        <h2 class="formula-list-title">公式列表</h2>
        <button id="toggle-all-formulas" class="toggle-all-btn" style="display:none;">全部展开</button>
      </div>
      <ul id="formula-list" class="formula-list"></ul>

      <div class="actions">
        <button id="download-btn" class="download-btn">⬇ 下载转换后的文件</button>
        <button id="reset-btn" class="reset-btn">重新上传</button>
      </div>
    </section>
  </main>
  <footer class="footer">MD→WPS 一键排版 · 本地运行</footer>
  <script src="app.js"></script>
</body>
</html>
